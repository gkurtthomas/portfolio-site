{% extends "main/base.html" %}

{% block title %}
Add Project
{% endblock %}

{% block content %}

<section class="projects py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="project-card">

                    <h1 class="mb-4 text-center">

                        Add New Project

                    </h1>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Add Project

                        </button>

                        <a
                            href="{% url 'project_list' %}"
                            class="btn btn-outline-light">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
