{% extends "main/base.html" %}

{% block title %}
Add Tech Stack
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="project-card">

                    <h1 class="text-center mb-4">
                        Add Tech Stack
                    </h1>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Tech Stack
                        </button>

                        <a
                            href="{% url 'dashboard' %}"
                            class="btn btn-outline-light"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
