{% extends "main/base.html" %}

{% block title %}
Admin Sign In
{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="project-card">

                    <h1 class="text-center mb-4">
                        Admin Sign In
                    </h1>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Sign In
                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a
                            href="{% url 'home' %}"
                            class="btn btn-outline-light"
                        >
                            Back to Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
</section>

{% endblock %}
